<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master's Graduation Celebration</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#292929}
body{display:flex;justify-content:center;padding:22px 8px}
.invitation{position:relative;width:min(100%,760px);line-height:0}
.invitation img{display:block;width:100%;height:auto}
.rsvp-link{
 position:absolute;
 left:45.2%;
 top:55.5%;
 width:52.7%;
 height:11.7%;
 border-radius:20px;
 z-index:5;
 cursor:pointer;
 text-indent:-9999px;
 overflow:hidden;
}
.rsvp-link:focus{outline:3px solid #fff;outline-offset:3px}
@media(max-width:520px){body{padding:0}.rsvp-link{border-radius:12px}}
</style>
</head>
<body>
<div class="invitation">
 <img src="invitation.png" alt="Master's Graduation Celebration invitation">
 <a class="rsvp-link"
    href="https://form.jotform.com/262794520723056"
    target="_blank" rel="noopener"
    aria-label="Please RSVP — click here to confirm your attendance">RSVP</a>
</div>
</body>
</html>
