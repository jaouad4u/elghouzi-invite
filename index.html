<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master's Graduation Celebration</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#292929}
body{display:flex;justify-content:center;padding:24px 8px}
.invite{position:relative;width:min(100%,760px);line-height:0}
.invite img{display:block;width:100%;height:auto}

/* Cover the original lower RSVP artwork with the surrounding gold area */
.cover{
 position:absolute;left:44%;top:73.3%;width:54%;height:12%;
 background:linear-gradient(135deg,#f4d38c 0%,#f8e0aa 48%,#e8bc62 100%);
 border-radius:8px;
}

/* The ONLY clickable RSVP button — placed in the blank area above event details */
.rsvp{
 position:absolute;
 left:51.2%;
 top:41.2%;
 width:43.8%;
 height:9.2%;
 display:flex;
 align-items:center;
 gap:9px;
 padding:8px 12px;
 border:3px solid #e5b83e;
 border-radius:18px;
 background:linear-gradient(180deg,#0a315f,#031d43 62%,#00162f);
 box-shadow:inset 0 0 0 2px #f6d16a44,0 0 12px #e4b53899,0 6px 12px #0007;
 text-decoration:none;
 z-index:3;
 line-height:1;
 transition:.18s ease;
}
.rsvp:hover{transform:scale(1.025);filter:brightness(1.08)}
.cal{flex:0 0 42px;width:42px;height:42px;border:3px solid #efbd3a;border-radius:7px;position:relative}
.cal:before,.cal:after{content:"";position:absolute;top:-8px;width:7px;height:13px;border-radius:4px;background:#efbd3a}
.cal:before{left:6px}.cal:after{right:6px}
.tick{position:absolute;left:10px;top:13px;width:19px;height:10px;border-left:5px solid #efbd3a;border-bottom:5px solid #efbd3a;transform:rotate(-45deg)}
.txt{flex:1;text-align:center;min-width:0}
.big{display:block;color:#f4c75a;font-family:Georgia,'Times New Roman',serif;font-size:clamp(14px,2.65vw,27px);font-weight:700;white-space:nowrap}
.small{display:block;color:#fff;font:700 clamp(7px,1.35vw,14px)/1.1 Arial,sans-serif;margin-top:5px}
.arrow{color:#f4c75a;font:700 clamp(22px,3.5vw,38px)/1 Georgia,serif}

@media(max-width:520px){
 body{padding:0}
 .rsvp{left:50.5%;top:41.1%;width:45%;height:9.4%;padding:5px 7px;gap:5px;border-width:2px;border-radius:11px}
 .cal{flex-basis:27px;width:27px;height:27px;border-width:2px;border-radius:4px}
 .cal:before,.cal:after{top:-5px;width:4px;height:9px}
 .cal:before{left:4px}.cal:after{right:4px}
 .tick{left:6px;top:8px;width:12px;height:7px;border-left-width:3px;border-bottom-width:3px}
 .small{margin-top:2px}
}
</style>
</head>
<body>
<div class="invite">
 <img src="invitation.png" alt="Master's Graduation Celebration invitation">
 <div class="cover" aria-hidden="true"></div>
 <a class="rsvp" href="https://form.jotform.com/262794520723056" target="_blank" rel="noopener">
   <span class="cal"><span class="tick"></span></span>
   <span class="txt">
     <span class="big">PLEASE RSVP</span>
     <span class="small">CLICK HERE TO CONFIRM<br>YOUR ATTENDANCE</span>
   </span>
   <span class="arrow">›</span>
 </a>
</div>
</body>
</html>
