<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master's Graduation Celebration</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#021c42;color:#fff}
body{display:flex;justify-content:center;overflow-x:hidden}
.page{width:min(100%,760px);min-height:100vh;position:relative;background:radial-gradient(circle at 50% 15%,#0b4eaa 0,#052e68 34%,#021b3e 75%);overflow:hidden;box-shadow:0 0 50px #0008}
.confetti{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#e3b340 1.3px,transparent 1.4px);background-size:37px 41px;opacity:.12;animation:drift 12s linear infinite}
@keyframes drift{to{background-position:80px 100px}}
.hero{position:relative;padding:24px 20px 8px;text-align:center}
.heroCrop{width:100%;aspect-ratio:1024/1120;overflow:hidden;border-radius:22px;border:2px solid #d9aa35;box-shadow:0 16px 45px #0008;animation:reveal 1.1s ease both}
.hero img{width:100%;height:auto;display:block}
@keyframes reveal{from{opacity:0;transform:translateY(25px) scale(.98)}to{opacity:1;transform:none}}
.info{text-align:center;padding:18px 28px 8px;animation:rise 1s .35s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{margin:0;color:#f0c15a;font-size:clamp(28px,6vw,50px);line-height:1.05;text-transform:uppercase}
h2{font-family:cursive;font-weight:400;font-size:clamp(30px,7vw,54px);margin:0 0 14px}
.degree{font-size:clamp(18px,4vw,27px);color:#f3c85d;font-weight:700}
.details{margin:22px auto 18px;padding:17px;border-top:1px solid #d7a83d;border-bottom:1px solid #d7a83d;font-size:clamp(16px,3.7vw,22px);line-height:1.6}
.rsvp{display:inline-block;margin:15px auto 35px;padding:18px 32px;border-radius:14px;background:linear-gradient(#f4cb67,#c99219);color:#071f46;text-decoration:none;font-family:Arial,sans-serif;font-weight:900;font-size:clamp(20px,5vw,30px);box-shadow:0 8px 0 #825e0d,0 14px 25px #0007;transition:.2s;animation:pulse 2.2s infinite}
.rsvp:hover{transform:translateY(-2px);filter:brightness(1.08)}
.rsvp:active{transform:translateY(5px);box-shadow:0 3px 0 #825e0d}
@keyframes pulse{50%{box-shadow:0 8px 0 #825e0d,0 14px 30px #d8a72f88}}
.small{font-family:Arial,sans-serif;font-size:13px;opacity:.82;margin-top:-20px;padding-bottom:30px}
@media(max-width:520px){.hero{padding:12px 10px 4px}.heroCrop{border-radius:14px}.info{padding:15px 18px 6px}.rsvp{width:88%}}
</style>
</head>
<body>
<main class="page">
<div class="confetti"></div>
<section class="hero">
  <!-- Crops the RSVP artwork printed at the bottom of invitation.png -->
  <div class="heroCrop">
    <img src="invitation.png" alt="Master's Graduation Celebration invitation">
  </div>
</section>
<section class="info">
  <h1>Master's Graduation</h1>
  <h2>Celebration</h2>
  <div class="degree">Cybersecurity &amp; Information Assurance</div>
  <div class="details">
    <strong>Saturday, November 28, 2026</strong><br>
    3:00 PM – 8:00 PM · Lunch &amp; Sweets<br>
    <strong>Clubhouse</strong><br>
    21851 Brickshire Cir, Ashburn, VA 20148
  </div>
  <a class="rsvp" href="https://form.jotform.com/262794520723056" target="_blank" rel="noopener">
    RSVP — CONFIRM ATTENDANCE
  </a>
  <div class="small">Tap the button to open the RSVP form.</div>
</section>
</main>
</body>
</html>
