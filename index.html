<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master's Graduation Celebration</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#292929}
body{display:flex;justify-content:center;padding:22px 8px}
.invitation{position:relative;width:min(100%,760px);line-height:0}
.invitation img{display:block;width:100%;height:auto;pointer-events:none}
.rsvp-link{
 position:absolute;
 left:45.0%;
 top:55.0%;
 width:54.0%;
 height:12.5%;
 display:block;
 z-index:9999;
 cursor:pointer;
 background:rgba(0,0,0,0.001);
 border-radius:20px;
}
.rsvp-link:focus{outline:3px solid white;outline-offset:2px}
@media(max-width:520px){body{padding:0}.rsvp-link{border-radius:12px}}
</style>
</head>
<body>
<div class="invitation">
 <img src="invitation.png" alt="Master's Graduation Celebration invitation">
 <a class="rsvp-link"
    href="https://form.jotform.com/262794520723056"
    aria-label="Please RSVP — confirm your attendance"
    title="Click to RSVP"></a>
</div>
</body>
</html>
