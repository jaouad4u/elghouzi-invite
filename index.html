<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master's Graduation Celebration</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    min-height:100%;
    background:#2b2b2b;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 10px;
  }
  .invite-wrap{
    position:relative;
    width:min(100%,760px);
    animation:fadeIn .7s ease both;
  }
  .invite{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
  }

  /* Clickable RSVP button positioned where your arrow indicates */
  .rsvp-overlay{
    position:absolute;
    left:52.5%;
    top:39.7%;
    width:43.5%;
    min-height:8.9%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-radius:18px;
    border:3px solid #dba92d;
    background:
      linear-gradient(180deg,#0b315f 0%,#031d42 58%,#00152f 100%);
    box-shadow:
      inset 0 0 0 2px rgba(255,215,105,.25),
      0 0 14px rgba(255,195,55,.65),
      0 7px 16px rgba(0,0,0,.40);
    text-decoration:none;
    transform-origin:center;
    transition:transform .18s ease, filter .18s ease;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .rsvp-overlay:hover{
    transform:scale(1.03);
    filter:brightness(1.08);
  }
  .rsvp-overlay:active{
    transform:scale(.98);
  }

  .icon{
    flex:0 0 44px;
    width:44px;
    height:44px;
    border:3px solid #efbd3a;
    border-radius:8px;
    position:relative;
  }
  .icon:before,.icon:after{
    content:"";
    position:absolute;
    top:-8px;
    width:7px;
    height:14px;
    border-radius:4px;
    background:#efbd3a;
  }
  .icon:before{left:7px}
  .icon:after{right:7px}
  .check{
    position:absolute;
    left:10px;
    top:14px;
    width:19px;
    height:10px;
    border-left:5px solid #efbd3a;
    border-bottom:5px solid #efbd3a;
    transform:rotate(-45deg);
  }

  .copy{
    flex:1;
    min-width:0;
    text-align:center;
    line-height:1.05;
  }
  .title{
    display:block;
    color:#f6ca62;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:clamp(13px,2.6vw,27px);
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .sub{
    display:block;
    margin-top:5px;
    color:#fff;
    font-weight:700;
    font-size:clamp(7px,1.45vw,14px);
    letter-spacing:.03em;
    line-height:1.15;
  }
  .chev{
    color:#f6ca62;
    font-family:Georgia,serif;
    font-size:clamp(22px,3.8vw,40px);
    line-height:1;
    margin-left:2px;
  }

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:none}
  }
  @keyframes pulse{
    0%,100%{box-shadow:inset 0 0 0 2px rgba(255,215,105,.25),0 0 12px rgba(255,195,55,.45),0 7px 16px rgba(0,0,0,.40)}
    50%{box-shadow:inset 0 0 0 2px rgba(255,215,105,.30),0 0 22px rgba(255,195,55,.85),0 7px 16px rgba(0,0,0,.40)}
  }

  @media (max-width:520px){
    body{padding:8px 0}
    .rsvp-overlay{
      left:51.7%;
      top:39.9%;
      width:45%;
      min-height:9.2%;
      padding:6px 8px;
      border-width:2px;
      border-radius:12px;
      gap:6px;
    }
    .icon{
      flex-basis:28px;
      width:28px;height:28px;
      border-width:2px;
      border-radius:5px;
    }
    .icon:before,.icon:after{top:-6px;width:5px;height:10px}
    .icon:before{left:4px}.icon:after{right:4px}
    .check{
      left:6px;top:9px;width:13px;height:7px;
      border-left-width:3px;border-bottom-width:3px;
    }
    .sub{margin-top:3px}
  }
</style>
</head>
<body>
  <div class="invite-wrap">
    <img class="invite" src="invitation.png" alt="Master's Graduation Celebration invitation">

    <a class="rsvp-overlay"
       href="https://form.jotform.com/262794520723056"
       target="_blank"
       rel="noopener"
       aria-label="Please RSVP and confirm your attendance">
      <span class="icon"><span class="check"></span></span>
      <span class="copy">
        <span class="title">PLEASE RSVP</span>
        <span class="sub">CLICK HERE TO CONFIRM<br>YOUR ATTENDANCE</span>
      </span>
      <span class="chev">›</span>
    </a>
  </div>
</body>
</html>
